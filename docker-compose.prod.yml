# Production Docker Compose Configuration
# Uses pre-built images from Docker Hub instead of building locally
# This is much faster for deployment and ensures consistency across environments

# Usage: docker-compose -f docker-compose.prod.yml up
# Or: docker-compose -f docker-compose.prod.yml -f docker-compose.prod.override.yml up

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: creators-platform-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: creators-platform
    volumes:
      - mongo_data_prod:/data/db
      - mongo_config_prod:/data/configdb
    networks:
      - creators-network
    # For production, use a named volume that persists across container restarts
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Express.js Backend Server
  # Uses pre-built image from Docker Hub
  server:
    image: giteshchaudhari2025/creator-platform-server:latest
    container_name: creators-platform-server-prod
    restart: always
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file:
      - ./server/.env
    # Secrets from environment variables or platform dashboard (for production)
    environment:
      PORT: 5000
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - creators-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # For production, you typically don't mount source code
    # Remove volumes binding - use only the container's internal files

  # React Frontend Client
  # Uses pre-built image from Docker Hub
  client:
    image: giteshchaudhari2025/creator-platform-client:latest
    container_name: creators-platform-client-prod
    restart: always
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - creators-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No volumes for production - everything is in the image

# Production volumes (persist data between container restarts)
volumes:
  mongo_data_prod:
    driver: local
  mongo_config_prod:
    driver: local

# Shared network for service communication
networks:
  creators-network:
    driver: bridge
