# Creators Platform - Full Stack Application
# This docker-compose file sets up the complete development environment
# with MongoDB, Express server, and React client

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: creators-platform-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: creators-platform
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - creators-network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "admin", "--password", "password123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Express.js Backend Server
  # Environment variables are loaded from env_file (Method 2: Best Practice)
  # - ./server/.env: Contains development values including secrets
  # - ./server/.env.docker: Overrides MONGODB_URI to use 'mongo' hostname (Docker-specific)
  # Docker Compose loads both files sequentially; values in .env.docker override .env
  # See: https://docs.docker.com/compose/environment-variables/
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: creators-platform-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file:
      - ./server/.env
      - ./server/.env.docker
    # Override only non-sensitive values that differ from env_file
    environment:
      PORT: 5000
    volumes:
      # Mount source code for development (optional - remove for production)
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - creators-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: creators-platform-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    volumes:
      # Mount source code for development hot reloading (optional - remove for production)
      - ./client:/app
      - /app/node_modules
    depends_on:
      server:
        condition: service_healthy
    networks:
      - creators-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Named volumes for data persistence
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

# Custom network for service isolation
networks:
  creators-network:
    driver: bridge
